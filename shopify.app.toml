# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "30606090ba14770084410af7b31ff7ae"
name = "GSO Wholesale Pricing Data"
application_url = "https://gso-wholesale-app-live.onrender.com"
embedded = true
handle = "gso-wholesale-pricing-data-9420752"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/webhooks/orders_paid"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# 12B.2b.1: read_inventory was briefly required here and caused an embedded auth
# loop (installed token lacked the new scope, so every admin.graphql call
# redirected to login). InventoryItem is readable with read_products;
# InventoryItem.unitCost may additionally need the staff "view product costs"
# granular permission. The Shopify Cost Audit page probes for cost access and
# degrades with a banner, so no new required scope is needed.
# Owner must run `shopify app deploy` after changing this line to publish it.
# 15F.0K.4E: read_all_orders added for Pricing Intelligence historical-order
# evidence (owner-approved 2026-07-26). READ-ONLY — write_orders is
# deliberately absent. Until the owner deploys + reauthorizes, order queries
# still work under read_orders but only cover Shopify's recent (~60-day)
# window; the Pricing Intelligence page states this and degrades gracefully
# (no auth loop: the existing token already authorizes the orders resource).
# 16B: + read_content (pages/blogs), read_online_store_navigation (menus/
# redirects), read_themes (templates/settings) — READ-ONLY additions for the
# Phase 16 store-rebuild audits/automation. No new write scopes.
scopes = "read_customers,read_orders,read_all_orders,read_products,write_products,write_discounts,read_draft_orders,write_draft_orders,read_cart_transforms,write_cart_transforms,read_content,read_online_store_navigation,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://gso-wholesale-app-live.onrender.com/auth/callback" ]

[app_proxy]
url = "https://gso-wholesale-app-live.onrender.com/apps/wholesale-lite"
subpath = "wholesale-lite"
prefix = "apps"

[pos]
embedded = false

